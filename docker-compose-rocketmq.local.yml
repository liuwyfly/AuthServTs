# RocketMQ 本地测试 override（与主文件合并使用，不影响生产配置）
#
# 前置条件:
#   docker swarm init   (如果本地还没初始化 Swarm)
#   docker network create --driver overlay --attachable ai100_ai100-me-network
#
# 部署:
#   docker stack deploy -c docker-compose-rocketmq.yml -c docker-compose-rocketmq.local.yml rocketmq
#
# 访问 dashboard:
#   http://localhost:8082/
#   (不走 traefik，直连容器端口；本地 override 去掉了 context-path，根路径访问)

services:
  rmq-dashboard:
    ports:
      # rocketmq-dashboard v2.x 镜像默认监听 8082（不是 8080）
      - target: 8082
        published: 8082
        mode: ingress
    environment:
      - JAVA_OPTS=-Drocketmq.config.namesrvAddr=rocketmq-namesrv:9876 -Drocketmq.config.loginRequired=true -Drocketmq.config.dataPath=/tmp/rocketmq-console/data
      - TZ=Asia/Shanghai
